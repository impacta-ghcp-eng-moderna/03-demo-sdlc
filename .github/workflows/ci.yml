name: CI
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Show .NET SDK version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore src/TrainingCatalog.slnx

      - name: Build solution
        run: dotnet build src/TrainingCatalog.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/TrainingCatalog.slnx --configuration Release --no-build --no-restore
