name: Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build, testes e publicação
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/TrainingCatalog.slnx

      - name: Build solution
        run: dotnet build src/TrainingCatalog.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/TrainingCatalog.slnx --configuration Release --no-build --no-restore

      - name: Publish API
        run: dotnet publish src/Api/TrainingCatalog.Api.csproj --configuration Release --no-restore --output artifacts/api

      - name: Publish client
        run: dotnet publish src/Client/TrainingCatalog.Client.csproj --configuration Release --no-restore --output artifacts/client

      - name: Upload application artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: training-catalog
          path: artifacts
          if-no-files-found: error
          retention-days: 7
