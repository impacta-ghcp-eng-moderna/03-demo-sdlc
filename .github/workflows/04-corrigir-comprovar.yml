name: Passo 4 - apos revisao

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

env:
  STEP_TRIGGER_PHRASE: revisado

jobs:
  progress_lab:
    if: >-
      ${{ !github.event.repository.is_template
      && !github.event.issue.pull_request
      && contains(github.event.issue.title, 'Lab: ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Avançar lab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/progress-step.sh \
            "${{ github.repository }}" \
            "${{ github.event.issue.number }}" \
            "${{ github.event.comment.body }}" \
            "${{ env.STEP_TRIGGER_PHRASE }}" \
            "${{ github.workflow }}" \
            "05-encerramento.yml" \
            ".github/steps/04-corrigir-comprovar.md" \
            "A revisão distinguiu comportamento comprovado de ausência de evidência, e você conferiu manualmente uma conclusão. Agora o handoff iniciará um diálogo para selecionar e confirmar uma única conclusão antes da implementação." \
            "Para avançar, confira o relatório e uma evidência e comente \`${{ env.STEP_TRIGGER_PHRASE }}\`." \
            "next"
